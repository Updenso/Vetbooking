name: Python CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # Especifique a versão do Python desejada

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt # Instala as dependências listadas no seu requirements.txt

    - name: Testar com pytest # Ou qualquer outro comando de teste que você use
      run: |
        pip install pytest
        pytest
