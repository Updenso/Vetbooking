name: Python CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
       mysql:
         image: mysql:8
    env:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: vetbooking
      ports:
        -- 3306:3306
      options: >-
        --health-cmd="mysqladmin ping --silent"
      
    steps:
    - uses: actions/checkout@v4
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # Especifique a versão do Python desejada

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt # Instala as dependências listadas no seu requirements.txt

    - name: Testar com pytest # Ou qualquer outro comando de teste que você use
      run: |
        python -m unittest discover -s test -p "*.py"

